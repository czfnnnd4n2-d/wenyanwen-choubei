@keyframes pulse{0%,100%{border-color:#e74c3c}50%{border-color:#ff9999}}
.bottom-bar{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn-act{font-size:14px;font-weight:600;padding:10px 16px;border-radius:24px;border:none;cursor:pointer;transition:.2s}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.book-sec{margin-top:14px}

.detail-sheet{background:rgba(255,255,255,0.95);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);width:92%;max-width:500px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}

.btn-save{background:var(--gr);color:var(--w)}

.frow label{font-size:12px;min-width:44px;text-align:right;color:var(--lt)}
.frow input,.frow select{flex:1;font-size:13px;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--w)}
.frow input:focus,.frow select:focus{outline:none;border-color:var(--br)}
.btn-add{background:var(--gr);color:var(--w);border:none;font-size:13px;font-weight:600;padding:9px 20px;border-radius:18px;cursor:pointer;margin-top:4px;width:100%}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#333;color:var(--w);padding:9px 20px;border-radius:18px;font-size:13px;z-index:200;animation:toastIn .3s,toastOut .3s 1.7s forwards;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
.result-summary{padding:8px 12px;margin-top:8px;border-radius:8px;font-size:13px;text-align:center;font-weight:600}

.result-summary.errors{background:#ffe8e8;color:#e74c3c}

.app-title{text-align:center;padding:0 10px;position:fixed;top:3vh;left:0;right:0;z-index:10}
.app-title span{font-family:"楷体",KaiTi,"PingFang SC",serif;font-size:42px;font-weight:900;letter-spacing:4px;color:#9B6B5E;text-shadow:0 0 12px rgba(255,255,255,0.9),0 0 24px rgba(255,255,255,0.7),0 2px 6px rgba(155,107,94,0.25)}
</style>
</head>
<body>

<div class="app-title"><span>萱萱书海印记</span></div>

<div class="topbar">
  <div class="mode-group" id="modeGroup">
    <button class="mode-btn active" data-count="1">1篇</button>
    <button class="mode-btn" data-count="3">3篇</button>
  </div>
  <button class="btn btn-draw" id="btnDraw">随机抽取</button>
  <button class="btn btn-catalog" id="btnCatalog">目录总表</button>
</div>

<div class="stat-bar" id="statBar">加载中…</div>
<div class="font-size-bar">
  <span>字号</span>
  <button class="font-size-btn" id="fontMinus">A-</button>
  <span class="font-size-val" id="fontVal">16</span>
  <button class="font-size-btn" id="fontPlus">A+</button>
</div>

<div class="cards-area" id="cardsArea">
  <div class="placeholder">点击「随机抽取」开始背诵</div>
</div>

<div class="bottom-bar" id="bottomBar">
  <button class="btn-act btn-mic" id="btnMic" disabled>开始背诵</button>
  <button class="btn-act btn-done" id="btnDone" disabled>已背完</button>
  <button class="btn-act btn-skip" id="btnSkip" disabled>跳过</button>
  <button class="btn-act btn-reveal" id="btnReveal" disabled>显示篇名</button>
  <button class="btn-act btn-text" id="btnText" disabled>显示全文</button>
  <button class="btn-act btn-reset" id="btnReset">重置本轮</button>
  <button class="btn-act btn-undo" id="btnUndo">撤销</button>
</div>

<!-- 目录弹窗 -->
<div class="overlay" id="overlay" style="display:none">
  <div class="sheet">
    <div class="sheet-hd"><span class="sheet-tt">文言文四册目录总表</span><button class="sheet-cl" id="sheetClose">&times;</button></div>
    <div class="sheet-tb"><button class="btn-act" style="background:var(--gr);color:var(--w);font-size:11px;padding:6px 12px" id="btnShowAdd">+ 添加</button><span style="font-size:11px;color:var(--gy);margin-left:8px" id="catalogCount"></span></div>
    <div class="sheet-bd" id="sheetBody"></div>
    <div id="addForm" style="display:none;padding:12px 18px 20px;border-top:1px solid var(--bd)">
      <div class="frow"><label>册别</label><select id="addBooklet"><option>壹 文人雅好</option><option>贰 愚人与智者</option><option>叁 读书与家教</option><option>肆 人类与动物</option></select></div>
      <div class="frow"><label>篇目</label><input id="addTitle" placeholder="篇目名称"></div>
      <div class="frow"><label>正文</label><input id="addText" placeholder="文言文正文（用于校对）"></div>
      <div class="frow"><label>标注</label><input id="addGrade" placeholder="如：七上"></div>
      <div class="frow"><label>备注</label><select id="addNote"><option>课内文言文</option><option selected>课外文言文</option></select></div>
      <button class="btn-add" id="btnConfirmAdd">确认添加</button>
    </div>
  </div>
</div>

<!-- 文章详情弹窗 -->
<div class="detail-overlay" id="detailOverlay" style="display:none">
  <div class="detail-sheet">
    <div class="detail-hd"><span class="detail-tt" id="detailTitle"></span><button class="sheet-cl" id="detailClose">&times;</button></div>
    <div class="detail-bd">
      <div class="detail-label">基本信息</div>
      <div class="detail-row">
        <label>册别</label>
        <select id="detailBooklet" style="width:130px">
          <option>壹 文人雅好</option><option>贰 愚人与智者</option><option>叁 读书与家教</option><option>肆 人类与动物</option>
        </select>
        <label>序号</label><input class="in-seq" id="detailSeq" type="number" min="1" max="99" placeholder="序号">
        <label>标注</label><input class="in-grade" id="detailGrade" placeholder="如：七上">
        <label>备注</label>
        <select id="detailNote"><option>课内文言文</option><option>课外文言文</option></select>
      </div>
      <div class="detail-label" style="margin-top:4px">正文内容（可编辑修改）</div>
      <textarea class="detail-text" id="detailText"></textarea>
    </div>
    <div class="detail-btns">
      <button class="btn-cancel" id="detailCancel">取消</button>
      <button class="btn-save" id="detailSave">保存修改</button>
    </div>
  </div>
</div>

<script>
// ==== ES5 Polyfills ====
if(!Array.prototype.forEach){Array.prototype.forEach=function(f,c){for(var i=0;i<this.length;i++)f.call(c,this[i],i,this);};}
if(!Array.prototype.filter){Array.prototype.filter=function(f,c){var r=[],i;for(i=0;i<this.length;i++){if(f.call(c,this[i],i,this))r.push(this[i]);}return r;};}
if(!Array.prototype.map){Array.prototype.map=function(f,c){var r=[],i;for(i=0;i<this.length;i++)r[i]=f.call(c,this[i],i,this);return r;};}
if(!Array.prototype.indexOf){Array.prototype.indexOf=function(v,s){s=s||0;for(var i=s;i<this.length;i++){if(this[i]===v)return i;}return -1;};}
if(!Object.keys){Object.keys=function(o){var r=[],k;for(k in o){if(o.hasOwnProperty(k))r.push(k);}return r;};}
if(!String.prototype.trim){String.prototype.trim=function(){return this.replace(/^\s+|\s+$/g,'');};}
function objValues(o){var r=[],k;for(k in o){if(o.hasOwnProperty(k))r.push(o[k]);}return r;}

// ==== 数据 ====
var INITIAL_DATA = [{"booklet": "壹 文人雅好", "title": "咏雪", "text": "谢太傅寒雪日内集，与儿女讲论文义。俄而雪骤，公欣然曰：“白雪纷纷何所似？”兄子胡儿曰：“撒盐空中差可拟。”兄女曰：“未若柳絮因风起。”公大笑乐。即公大兄无奕女，左将军王凝之妻也。", "grade": "七上", "note": "课内文言文"}, {"booklet": "壹 文人雅好", "title": "陋室铭", "text": "山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？", "grade": "七下", "note": "课内文言文"}, {"booklet": "壹 文人雅好", "title": "爱莲说", "text": "水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣。", "grade": "七下", "note": "课内文言文"}, {"booklet": "壹 文人雅好", "title": "酒以成礼", "text": "钟毓兄弟小时，值父昼寝，因共偷服药酒。其父时觉，且托寐以观之。毓拜而后饮，会饮而不拜。既而问毓何以拜，毓曰：“酒以成礼，不敢不拜。”又问会何以不拜，会曰：“偷本非礼，所以不拜。”", "grade": "七上", "note": "课内文言文"}, {"booklet": "壹 文人雅好", "title": "陆绩怀橘", "text": "陆绩，三国时吴人也。官至太守，精于天文、历法。绩年六岁，于九江见袁术。术出橘，绩怀三枚；去，拜辞堕地。术谓曰：“陆郎作宾客而怀橘乎？”绩跪答曰：“是橘甘，欲怀而遗母。”术大奇之。", "grade": "七上", "note": "课内文言文"}, {"booklet": "壹 文人雅好", "title": "雪夜访戴", "text": "王子猷居山阴，夜大雪，眠觉，开室，命酌酒。四望皎然，因起彷徨，咏左思《招隐诗》。忽忆戴安道。时戴在剡，即便夜乘小船就之。经宿方至，造门不前而返。人问其故，王曰：“吾本乘兴而行，兴尽而返，何必见戴？”", "grade": "七上", "note": "课内文言文"}, {"booklet": "壹 文人雅好", "title": "王羲之诈眠", "text": "王右军年减十岁时，大将军甚爱之，恒置帐中眠。大将军尝先出，右军犹未起。须臾，钱凤入，屏人论事，都忘右军在帐中，便言逆节之谋。右军觉，既闻所论，知无活理，乃阳吐污头面被褥，诈孰眠。敦论事造半，方忆右军未起，相与大惊曰：“不得不除之！”及开帐，乃见吐唾纵横，信其实孰眠，于是得全。于时称其有智。", "grade": "七上", "note": "课内文言文"}, {"booklet": "壹 文人雅好", "title": "兰芷之室", "text": "与善人居，如入芝兰之室，久而不闻其香，即与之化矣。与不善人居，如入鲍鱼之肆，久而不闻其臭，亦与之化矣。丹之所藏者赤，漆之所藏者黑，是以君子必慎其所处者焉。", "grade": "七下", "note": "课内文言文"}, {"booklet": "壹 文人雅好", "title": "康僧渊弃舍", "text": "康僧渊在豫章，去郭数十里立精舍，旁连岭，带长川，芳林列于轩庭，清流激于堂宇。乃闲居研讲，希心理味。庾公诸人多往看之，观其运用吐纳，风流转佳。加已处之怡然，亦有以自得，声名乃兴。后不堪，遂出。", "grade": "七下", "note": "课内文言文"}, {"booklet": "贰 愚人与智者", "title": "穿井得一人", "text": "宋之丁氏，家无井而出溉汲，常一人居外。及其家穿井，告人曰：“吾穿井得一人。”有闻而传之者：“丁氏穿井得一人。”国人道之，闻之于宋君。宋君令人问之于丁氏，丁氏对曰：“得一人之使，非得一人于井中也。”求闻之若此，不若无闻也。", "grade": "七上", "note": "课内文言文"}, {"booklet": "贰 愚人与智者", "title": "杞人忧天", "text": "杞国有人忧天地崩坠，身亡所寄，废寝食者。又有忧彼之所忧者，因往晓之，曰：“天，积气耳，亡处亡气。若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？”其人曰：“天果积气，日月星宿，不当坠耶？”晓之者曰：“日月星宿，亦积气中之有光耀者，只使坠，亦不能有所中伤。”其人曰：“奈地坏何？”晓者曰：“地，积块耳，充塞四虚，亡处亡块。若躇步跐蹈，终日在地上行止，奈何忧其坏？”其人舍然大喜，晓之者亦舍然大喜。", "grade": "七上", "note": "课内文言文"}, {"booklet": "贰 愚人与智者", "title": "陈太丘与友期行", "text": "陈太丘与友期行，期日中。过中不至，太丘舍去，去后乃至。元方时年七岁，门外戏。客问元方：“尊君在不？”答曰：“待君久不至，已去。”友人便怒曰：“非人哉！与人期行，相委而去。”元方曰：“君与家君期日中。日中不至，则是无信；对子骂父，则是无礼。”友人惭，下车引之。元方入门不顾。", "grade": "七上", "note": "课内文言文"}, {"booklet": "贰 愚人与智者", "title": "愚人食盐", "text": "昔有愚人，至于他家。主人与食，嫌淡无味。主人闻已，更为益盐。既得盐美，便自念言：“所以美者，缘有盐故。少有尚尔，况复多也？”愚人无智，便空食盐。食已口爽，返为其患。", "grade": "", "note": "课外经典常读"}, {"booklet": "贰 愚人与智者", "title": "吾腰千钱", "text": "永之氓咸善游。一日，水暴甚，有五六氓乘小船绝湘水。中济，船破，皆游。其一氓尽力而不能寻常。其侣曰：“汝善游最也，今何后为？”曰：“吾腰千钱，重，是以后。”曰：“何不去之？”不应，摇其首。有顷，益怠。已济者立岸上，呼且号曰：“汝愚之甚，蔽之甚！身且死，何以货为？”又摇其首，遂溺死。", "grade": "", "note": "课外经典常读"}, {"booklet": "贰 愚人与智者", "title": "子罕弗受玉", "text": "宋人或得玉，献诸子罕。子罕弗受。献玉者曰：“以示玉人，玉人以为宝也，故敢献之。”子罕曰：“我以不贪为宝，尔以玉为宝。若以与我，皆丧宝也，不若人有其宝。”", "grade": "", "note": "课外经典常读"}, {"booklet": "贰 愚人与智者", "title": "杨震四知", "text": "杨震为东莱太守，当之郡，道经昌邑，故所举荆州茂才王密为昌邑令，谒见，至夜怀金十斤以遗震。震曰：“故人知君，君不知故人，何也？”密曰：“暮夜无知者。”震曰：“天知，神知，我知，子知。何谓无知！”密愧而出。", "grade": "七上", "note": "课内文言文"}, {"booklet": "贰 愚人与智者", "title": "魏文侯与虞人期猎", "text": "魏文侯与虞人期猎。是日，饮酒乐，天雨。文侯将出，左右曰：“今日饮酒乐，天又雨，公将焉之？”文侯曰：“吾与虞人期猎，虽乐，岂可不一会期哉！”乃往，身自罢之。魏于是乎始强。", "grade": "七上", "note": "课内文言文"}, {"booklet": "贰 愚人与智者", "title": "立木取信", "text": "令既具，未布，恐民之不信，已乃立三丈之木于国都市南门，募民有能徙置北门者予十金。民怪之，莫敢徙。复曰“能徙者予五十金”。有一人徙之，辄予五十金，以明不欺。卒下令。", "grade": "七上", "note": "课内文言文"}, {"booklet": "贰 愚人与智者", "title": "陶侃惜谷", "text": "陶侃尝出游，见人持一把未熟稻，侃问：“用此何为？”人云：“行道所见，聊取之耳。”侃大怒曰：“汝既不田，而戏贼人稻！”执而鞭之。是以百姓勤于农殖，家给人足。", "grade": "", "note": "课外经典常读"}, {"booklet": "贰 愚人与智者", "title": "齐人有好猎者", "text": "齐人有好猎者，旷日持久而不得兽，入则愧其家室，出则愧其知友州里。惟其所以不得之故，则狗恶也。欲得良狗，则家贫无以。于是还疾耕，疾耕则家富，家富则有以求良狗，狗良则数得兽矣，田猎之获，常过人矣。非独猎也，百事也尽然。", "grade": "", "note": "课外经典常读"}, {"booklet": "叁 读书与家教", "title": "诫子书", "text": "夫君子之行，静以修身，俭以养德。非淡泊无以明志，非宁静无以致远。夫学须静也，才须学也，非学无以广才，非志无以成学。淫慢则不能励精，险躁则不能治性。年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！", "grade": "七上", "note": "课内文言文"}, {"booklet": "叁 读书与家教", "title": "孙权劝学", "text": "初，权谓吕蒙曰：“卿今当涂掌事，不可不学！”蒙辞以军中多务。权曰：“孤岂欲卿治经为博士邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤常读书，自以为大有所益。”蒙乃始就学。及鲁肃过寻阳，与蒙论议，大惊曰：“卿今者才略，非复吴下阿蒙！”蒙曰：“士别三日，即更刮目相待，大兄何见事之晚乎！”肃遂拜蒙母，结友而别。", "grade": "七下", "note": "课内文言文"}, {"booklet": "叁 读书与家教", "title": "《论语》十二章", "text": "子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”曾子曰：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”子曰：“吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”子曰：“温故而知新，可以为师矣。”子曰：“学而不思则罔，思而不学则殆。”子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！”子曰：“知之者不如好之者，好之者不如乐之者。”子曰：“饭疏食饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。”子曰：“三人行，必有我师焉。择其善者而从之，其不善者而改之。”子在川上曰：“逝者如斯夫，不舍昼夜。”子曰：“三军可夺帅也，匹夫不可夺志也。”子夏曰：“博学而笃志，切问而近思，仁在其中矣。”", "grade": "七上", "note": "课内文言文"}, {"booklet": "叁 读书与家教", "title": "孟母教子", "text": "孟子少时，诵，其母方织。孟子辍然中止，乃复进。其母知其愃也，呼而问之曰：“何为中止？”对曰：“有所失，复得。”其母引刀裂其织，以此诫之。自是之后，孟子不复愃矣。", "grade": "", "note": "课外经典常读"}, {"booklet": "叁 读书与家教", "title": "曾子杀彘", "text": "曾子之妻之市，其子随之而泣。其母曰：“女还，顾反为女杀彘。”妻适市来，曾子欲捕彘杀之。妻止之曰：“特与婴儿戏耳。”曾子曰：“婴儿非与戏也。婴儿非有知也，待父母而学者也，听父母之教。今子欺之，是教子欺也。母欺子，子而不信其母，非所以成教也。”遂烹彘也。", "grade": "", "note": "课外经典常读"}, {"booklet": "叁 读书与家教", "title": "张溥嗜学", "text": "张溥幼嗜学，所读书必手钞，钞已朗诵一过，即焚之，又钞，如是者六七始已。右手握管处，指掌成茧。冬日手皲，日沃汤数次。后名读书之斋曰“七录”。溥诗文敏捷，四方征索者，不起草，对客挥毫，俄顷立就，以故名高一时。", "grade": "", "note": "课外经典常读"}, {"booklet": "叁 读书与家教", "title": "师旷劝学", "text": "晋平公问于师旷曰：“吾年七十，欲学，恐已暮矣。”师旷曰：“何不炳烛乎？”平公曰：“安有为人臣而戏其君乎？”师旷曰：“盲臣安敢戏其君乎！臣闻之，少而好学，如日出之阳；壮而好学，如日中之光；老而好学，如炳烛之明。炳烛之明，孰与昧行乎？”平公曰：“善哉！”", "grade": "", "note": "课外经典常读"}, {"booklet": "叁 读书与家教", "title": "青出于蓝", "text": "君子曰：学不可以已。青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，輮以为轮，其曲中规。虽有槁暴，不复挺者，輮使之然也。故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。", "grade": "", "note": "课外经典常读"}, {"booklet": "叁 读书与家教", "title": "不积跬步", "text": "积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。故不积跬步，无以至千里；不积小流，无以成江海。骐骥一跃，不能十步；驽马十驾，功在不舍。锲而舍之，朽木不折；锲而不舍，金石可镂。", "grade": "", "note": "课外经典常读"}, {"booklet": "肆 人类与动物", "title": "卖油翁", "text": "陈康肃公善射，当世无双，公亦以此自矜。尝射于家圃，有卖油翁释担而立，睨之久而不去。见其发矢十中八九，但微颔之。康肃问曰：“汝亦知射乎？吾射不亦精乎？”翁曰：“无他，但手熟尔。”康肃忿然曰：“尔安敢轻吾射！”翁曰：“以我酌油知之。”乃取一葫芦置于地，以钱覆其口，徐以杓酌油沥之，自钱孔入，而钱不湿。因曰：“我亦无他，惟手熟尔。”康肃笑而遣之。", "grade": "七下", "note": "课内文言文"}, {"booklet": "肆 人类与动物", "title": "狼", "text": "一屠晚归，担中肉尽，止有剩骨。途中两狼，缀行甚远。屠惧，投以骨。一狼得骨止，一狼仍从。复投之，后狼止而前狼又至。骨已尽矣，而两狼之并驱如故。屠大窘，恐前后受其敌。顾野有麦场，场主积薪其中，苫蔽成丘。屠乃奔倚其下，弛担持刀。狼不敢前，眈眈相向。少时，一狼径去，其一犬坐于前。久之，目似瞑，意暇甚。屠暴起，以刀劈狼首，又数刀毙之。方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。身已半入，止露尻尾。屠自后断其股，亦毙之。乃悟前狼假寐，盖以诱敌。狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。", "grade": "七下", "note": "课内文言文"}, {"booklet": "肆 人类与动物", "title": "活板", "text": "板印书籍，唐人尚未盛为之。自冯瀛王始印五经，已后典籍皆为板本。庆历中，有布衣毕昇，又为活板。其法：用胶泥刻字，薄如钱唇，每字为一印，火烧令坚。先设一铁板，其上以松脂、蜡和纸灰之类冒之。欲印，则以一铁范置铁板上，乃密布字印，满铁范为一板，持就火炀之；药稍镕，则以一平板按其面，则字平如砥。若止印三二本，未为简易；若印数十百千本，则极为神速。", "grade": "", "note": "课外经典常读"}, {"booklet": "肆 人类与动物", "title": "击皮得实", "text": "人有负盐负薪者，同释重担，息于树荫。少时，二人将行，争一羊皮，各言藉背之物。惠遣争者出，顾州纲纪曰：“以此羊皮可拷知主乎？”群下咸无应者。惠令人置羊皮席上，以杖击之，见少盐屑，曰：“得其实矣。”使争者视之，负薪者乃伏而就罪。", "grade": "", "note": "课外经典常读"}, {"booklet": "肆 人类与动物", "title": "蔡伦造纸", "text": "蔡伦，字敬仲，桂阳人也。永元九年，监作秘剑及诸器械，莫不精工坚密，为后世法。自古书契多编以竹简，其用缣帛者谓之为纸。缣贵而简重，并不便于人。伦乃造意，用树肤、麻头及敝布、鱼网以为纸。元兴元年奏上之，帝善其能，自是莫不从用焉，故天下咸称“蔡侯纸”。", "grade": "", "note": "课外经典常读"}, {"booklet": "肆 人类与动物", "title": "得过且过", "text": "五台山有鸟，名寒号虫。四足，有肉翅，不能飞，其粪即五灵脂。当盛暑时，文采绚烂，乃自鸣曰：“凤凰不如我。”比至深冬严寒之际，毛羽脱落，索然如鷇雏，遂自鸣曰：“得过且过。”", "grade": "", "note": "课外经典常读"}, {"booklet": "肆 人类与动物", "title": "狼子野心", "text": "有富室偶得二小狼，与家犬杂畜，亦与犬相安。稍长，亦颇驯，竟忘其为狼。一日，主人昼寝厅事，闻群犬呜呜作怒声，惊起周视，无一人。再就枕将寐，犬又如前。乃伪睡以俟，则二狼伺其未觉，将啮其喉，犬阻之不使前也。乃杀而取其革。“狼子野心”，信不诬哉！然野心不过遁逸耳；阳为亲昵，而阴怀不测，更不止于野心矣。兽不足道，此人何取而自贻患耶？", "grade": "", "note": "课外经典常读"}];

var BOOKLET_ORDER = ["壹 文人雅好","贰 愚人与智者","叁 读书与家教","肆 人类与动物"];

// ==== localStorage ====
function safeGet(k,d){try{var v=localStorage.getItem(k);if(v!==null)return JSON.parse(v);}catch(e){}return d;}
function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function loadArticles(){
  var saved=safeGet('articles_data',null);
  if(saved) return saved;
  var copy=JSON.parse(JSON.stringify(INITIAL_DATA));
  calcInitialSeq(copy);
  return copy;
}
function saveArticles(){safeSet('articles_data',articles);}
function calcInitialSeq(arr){
  var i,j,k,list;
  for(i=0;i<BOOKLET_ORDER.length;i++){
    list=[];
    for(j=0;j<arr.length;j++){if(arr[j].booklet===BOOKLET_ORDER[i])list.push(arr[j]);}
    for(k=0;k<list.length;k++){list[k].seq=k+1;}
  }
}

var articles=loadArticles();
var hasMissingSeq=false,i;
for(i=0;i<articles.length;i++){if(!articles[i].seq||typeof articles[i].seq!=='number'){articles[i].seq=0;hasMissingSeq=true;}}
if(hasMissingSeq) calcInitialSeq(articles);
saveArticles();

// ==== 字号设置 ====
var FONT_MIN=12,FONT_MAX=32,FONT_STEP=2;
var fontSize=safeGet('font_size',16);
function applyFontSize(){
  document.documentElement.style.setProperty('--text-size',fontSize+'px');
  document.getElementById('fontVal').textContent=fontSize;
}
function adjustFont(delta){
  fontSize+=delta;
  if(fontSize<FONT_MIN)fontSize=FONT_MIN;
  if(fontSize>FONT_MAX)fontSize=FONT_MAX;
  safeSet('font_size',fontSize);
  applyFontSize();
}
applyFontSize();
document.getElementById('fontMinus').onclick=function(){adjustFont(-FONT_STEP);};
document.getElementById('fontPlus').onclick=function(){adjustFont(FONT_STEP);};

// ==== 背诵状态 ====
function loadState(){
  var s=safeGet('recite_state_v4',{});
  if(!s.articles) s.articles={};
  if(!s.current_round) s.current_round=1;
  return s;
}
function saveState(){safeSet('recite_state_v4',state);}
function syncState(){
  var titles={},t;
  for(i=0;i<articles.length;i++) titles[articles[i].title]=true;
  for(t in state.articles){if(state.articles.hasOwnProperty(t)&&!titles[t]) delete state.articles[t];}
  for(i=0;i<articles.length;i++){
    t=articles[i].title;
    if(!state.articles[t]) state.articles[t]={done:false,round:0};
  }
  if(!state.current_round) state.current_round=1;
  saveState();
}

var state=loadState();
syncState();

// ==== UI 引用 ====
function $(id){return document.getElementById(id);}
var modeGroup=$('modeGroup'),btnDraw=$('btnDraw'),btnCatalog=$('btnCatalog');
var statBar=$('statBar'),cardsArea=$('cardsArea');
var btnMic=$('btnMic'),btnDone=$('btnDone'),btnSkip=$('btnSkip'),btnReveal=$('btnReveal'),btnText=$('btnText'),btnReset=$('btnReset'),btnUndo=$('btnUndo');
var overlay=$('overlay'),sheetBody=$('sheetBody'),sheetClose=$('sheetClose'),btnShowAdd=$('btnShowAdd'),addForm=$('addForm'),btnConfirmAdd=$('btnConfirmAdd'),catalogCount=$('catalogCount');
var detailOverlay=$('detailOverlay'),detailTitle=$('detailTitle'),detailText=$('detailText'),detailBooklet=$('detailBooklet'),detailSeq=$('detailSeq'),detailGrade=$('detailGrade'),detailNote=$('detailNote'),detailClose=$('detailClose'),detailCancel=$('detailCancel'),detailSave=$('detailSave');
var detailEditingIdx=-1;

// ==== 模式 ====
var mode=1;
modeGroup.onclick=function(e){
  var btn=e.target;
  while(btn&&!btn.classList.contains('mode-btn')) btn=btn.parentNode;
  if(!btn) return;
  var all=modeGroup.querySelectorAll('.mode-btn'),j;
  for(j=0;j<all.length;j++) all[j].classList.remove('active');
  btn.classList.add('active');
  mode=parseInt(btn.getAttribute('data-count'));
};

// ==== 统计 ====
function refreshStat(){
  var done=0,total=articles.length,i,v;
  for(i=0;i<articles.length;i++){
    v=state.articles[articles[i].title];
    if(v&&v.round>=state.current_round) done++;
  }
  var remaining=total-done;
  if(done>=total) statBar.textContent='第 '+state.current_round+' 轮全部完成！点击抽取开始第 '+(state.current_round+1)+' 轮';
  else statBar.textContent='第 '+state.current_round+' 轮  |  已背 '+done+'/'+total+'  |  剩余 '+remaining+' 篇';
}
var revealedCards={};        // 只标记篇名是否已显示
var textRevealedCards={};    // 正文是否已显示
var currentDraw=[];
function clearCards(){
  cardsArea.innerHTML='';
  revealedCards={};
  textRevealedCards={};
}
function disableActions(){btnMic.disabled=true;btnDone.disabled=true;btnSkip.disabled=true;btnReveal.disabled=true;btnText.disabled=true;}
function enableActions(){
  btnMic.disabled=false;btnDone.disabled=false;btnSkip.disabled=false;
  // 如果没有显示篇名，显示篇名按钮可用；如果已显示篇名但未显示正文，显示全文按钮可用
  updateRevealBtns();
}
function updateRevealBtns(){
  var allRev=true,allText=true;
  for(var i=0;i<currentDraw.length;i++){
    if(!revealedCards[i]) allRev=false;
    if(!textRevealedCards[i]) allText=false;
  }
  btnReveal.disabled=allRev;
  btnText.disabled=allText;
}
function showPlaceholder(){clearCards();cardsArea.innerHTML='<div class="placeholder">点击「随机抽取」开始背诵</div>';}

// ==== 抽取 ====
function shuffle(arr){
  var a=[],j,tmp;
  for(i=0;i<arr.length;i++) a.push(arr[i]);
  for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));tmp=a[i];a[i]=a[j];a[j]=tmp;}
  return a;
}
function draw(){
  clearCards();disableActions();
  var rnd=state.current_round,pool=[],i,v;
  for(i=0;i<articles.length;i++){
    v=state.articles[articles[i].title];
    if(!v||v.round<rnd) pool.push(articles[i]);
  }
  if(pool.length===0){state.current_round++;saveState();for(i=0;i<articles.length;i++)pool.push(articles[i]);}
  var count=Math.min(mode,pool.length);
  currentDraw=shuffle(pool).slice(0,count);
  for(i=0;i<currentDraw.length;i++){
    var art=currentDraw[i];
    var card=document.createElement('div');card.className='card';
    var bi=BOOKLET_ORDER.indexOf(art.booklet)+1;
    var seq=art.seq||'?';
    card.innerHTML='<div class="card-header"><span>第 '+(i+1)+' 篇</span><span style="color:#FFD700">'+art.booklet+'</span></div>'+
      '<div class="card-body"><div class="card-index">第'+bi+'册  第'+seq+'篇</div>'+
      '<div class="card-booklet">'+art.booklet+'</div>'+
      '<div class="transcript-box" id="transcript-'+i+'" style="display:none"></div>'+
      '<div class="card-original" id="original-'+i+'" style="display:none"></div></div>';
    cardsArea.appendChild(card);
  }
  enableActions();refreshStat();
}

// ==== 显示篇名（只显示标题，不显示正文）====
function revealTitle(){
  var allDone=true;
  for(var i=0;i<currentDraw.length;i++){
    if(revealedCards[i]) continue;
    allDone=false;
    var art=currentDraw[i];
    var card=cardsArea.children[i];if(!card) continue;
    var body=card.querySelector('.card-body');
    card.querySelector('.card-header').classList.add('revealed');
    var titleDiv=body.querySelector('.card-title');
    if(!titleDiv){titleDiv=document.createElement('div');titleDiv.className='card-title';}
    titleDiv.textContent=art.title;
    var info=body.querySelector('.card-info');
    if(!info){info=document.createElement('div');info.className='card-info';}
    info.textContent=(art.grade||'')+'  |  '+(art.note||'');
    var tb=body.querySelector('.transcript-box');
    if(tb){body.insertBefore(info,tb);body.insertBefore(titleDiv,info);}
    else{body.appendChild(titleDiv);body.appendChild(info);}
    revealedCards[i]=true;
  }
  if(allDone){toast('所有篇名已显示');}
  updateRevealBtns();
}

// ==== 显示全文（含篇名 + 正文）====
function revealText(){
  var allDone=true;
  for(var i=0;i<currentDraw.length;i++){
    if(textRevealedCards[i]) continue;
    allDone=false;
    var art=currentDraw[i];
    var card=cardsArea.children[i];if(!card) continue;
    // 先确保篇名显示
    if(!revealedCards[i]){
      card.querySelector('.card-header').classList.add('revealed');
      var body=card.querySelector('.card-body');
      var titleDiv=body.querySelector('.card-title');
      if(!titleDiv){titleDiv=document.createElement('div');titleDiv.className='card-title';}
      titleDiv.textContent=art.title;
      var info=body.querySelector('.card-info');
      if(!info){info=document.createElement('div');info.className='card-info';}
      info.textContent=(art.grade||'')+'  |  '+(art.note||'');
      var tb=body.querySelector('.transcript-box');
      if(tb){body.insertBefore(info,tb);body.insertBefore(titleDiv,info);}
      else{body.appendChild(titleDiv);body.appendChild(info);}
      revealedCards[i]=true;
    }
    // 显示正文
    var orig=document.getElementById('original-'+i);
    if(orig){
      orig.style.display='block';
      orig.innerHTML=buildOriginalHTML(art.text);
    }
    textRevealedCards[i]=true;
  }
  if(allDone){toast('所有全文已显示');}
  btnReveal.disabled=true;
  updateRevealBtns();
}

function buildOriginalHTML(text){
  var chars=text.split(''),html='',j;
  for(j=0;j<chars.length;j++) html+='<span>'+chars[j]+'</span>';
  return html;
}

// ==== 语音 ====
var isRecording=false,recognition=null;
function startRecording(){
  if(isRecording) return;
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('浏览器不支持语音识别，请用 Safari 或 Chrome');return;}
  // 先确保篇名和正文显示（语音校对需要看原文）
  var i,body,orig,tr,td,inf;
  for(i=0;i<currentDraw.length;i++){
    body=cardsArea.children[i]?cardsArea.children[i].querySelector('.card-body'):null;
    if(!body) continue;
    // 显示篇名（如果还没显示）
    if(!revealedCards[i]){
      cardsArea.children[i].querySelector('.card-header').classList.add('revealed');
      td=body.querySelector('.card-title');
      if(!td){td=document.createElement('div');td.className='card-title';}
      td.textContent=currentDraw[i].title;
      inf=body.querySelector('.card-info');
      if(!inf){inf=document.createElement('div');inf.className='card-info';}
      inf.textContent=(currentDraw[i].grade||'')+'  |  '+(currentDraw[i].note||'');
      tr=body.querySelector('#transcript-'+i);
      if(tr){body.insertBefore(inf,tr);body.insertBefore(td,inf);}
      else{body.appendChild(td);body.appendChild(inf);}
      revealedCards[i]=true;
    }
    // 显示原文
    orig=body.querySelector('#original-'+i);
    if(orig){orig.style.display='block';orig.innerHTML=buildOriginalHTML(currentDraw[i].text);}
    textRevealedCards[i]=true;
    // 清空转录
    tr=body.querySelector('#transcript-'+i);
    if(tr){tr.style.display='block';tr.textContent='';tr.classList.add('listening');}
  }
  btnReveal.disabled=true;btnText.disabled=true;
  recognition=new SR();
  recognition.lang='zh-CN';recognition.interimResults=true;recognition.continuous=true;recognition.maxAlternatives=1;
  recognition.onresult=function(e){
    var t='',j;for(j=e.resultIndex;j<e.results.length;j++) t+=e.results[j][0].transcript;
    var tr0=document.getElementById('transcript-0');if(tr0) tr0.textContent=t;
  };
  recognition.onerror=function(e){
    if(e.error==='no-speech'){toast('未检测到语音，请再试一次');stopRecordingUI();}
    else if(e.error==='aborted'){stopRecordingUI();}
    else{toast('语音错误:'+e.error);stopRecordingUI();}
  };
  recognition.onend=function(){stopRecordingUI();autoCheckAll();};
  try{recognition.start();isRecording=true;btnMic.textContent='停止背诵';btnMic.classList.add('recording');btnDone.disabled=true;btnSkip.disabled=true;}
  catch(ex){toast('无法启动麦克风，请检查权限');}
}
function stopRecording(){
  if(recognition)try{recognition.stop();}catch(e){}
  stopRecordingUI();autoCheckAll();
}
function stopRecordingUI(){
  isRecording=false;btnMic.textContent='开始背诵';btnMic.classList.remove('recording');
  btnDone.disabled=false;btnSkip.disabled=false;
  var boxes=document.querySelectorAll('.transcript-box.listening'),k;
  for(k=0;k<boxes.length;k++) boxes[k].classList.remove('listening');
}
function autoCheckAll(){
  var i,tr,orig,spoken,result;
  for(i=0;i<currentDraw.length;i++){
    tr=document.getElementById('transcript-'+i);
    orig=document.getElementById('original-'+i);
    if(!tr||!orig) continue;
    spoken=tr.textContent.trim();if(!spoken) continue;
    result=compareText(currentDraw[i].text,spoken);
    renderCompare(orig,result,i);
  }
}

// ==== 文本比对 ====
function normalize(s){return s.replace(/[，。、；：！？\u201c\u201d\u2018\u2019《》（）\s\n\r]/g,'');}
function compareText(original,spoken){
  var o=normalize(original),s=normalize(spoken);
  var result=[],oi=0,si=0;
  while(oi<o.length||si<s.length){
    if(oi>=o.length){result.push({type:'extra',char:s[si]});si++;continue;}
    if(si>=s.length){result.push({type:'missing',char:o[oi]});oi++;continue;}
    if(o[oi]===s[si]){result.push({type:'match',char:o[oi]});oi++;si++;}
    else if(si+1<s.length&&o[oi]===s[si+1]){result.push({type:'extra',char:s[si]});si++;}
    else if(oi+1<o.length&&o[oi+1]===s[si]){result.push({type:'missing',char:o[oi]});oi++;}
    else{result.push({type:'wrong',char:o[oi],spoken:s[si]});oi++;si++;}
  }
  return result;
}
function renderCompare(origEl,result,cardIdx){
  var html='',errs=0,i,r;
  for(i=0;i<result.length;i++){
    r=result[i];
    if(r.type==='match') html+='<span>'+r.char+'</span>';
    else if(r.type==='missing'){html+='<span class="missing">'+r.char+'</span>';errs++;}
    else if(r.type==='extra'){html+='<span class="extra">'+r.char+'</span>';errs++;}
    else if(r.type==='wrong'){html+='<span class="wrong">'+r.char+'</span>';errs++;}
  }
  origEl.innerHTML=html;
  var card=cardsArea.children[cardIdx];if(!card) return;
  var sum=card.querySelector('.result-summary');
  if(!sum){sum=document.createElement('div');sum.className='result-summary';card.querySelector('.card-body').appendChild(sum);}
  if(errs===0){sum.className='result-summary perfect';sum.textContent='背诵完全正确！';}
  else{sum.className='result-summary errors';sum.textContent='发现 '+errs+' 处差异（红色标记为错误/遗漏/多余）';}
}

// ==== 标记 ====
function markDone(){
  if(isRecording){stopRecording();}
  var rnd=state.current_round;
  for(var i=0;i<currentDraw.length;i++){
    state.articles[currentDraw[i].title].done=true;
    state.articles[currentDraw[i].title].round=rnd;
  }
  saveState();currentDraw=[];showPlaceholder();disableActions();refreshStat();
  var allDone=true;
  for(i=0;i<articles.length;i++){if(!state.articles[articles[i].title]||state.articles[articles[i].title].round<rnd){allDone=false;break;}}
  if(allDone) toast('第 '+rnd+' 轮全部背完！');
}
function markSkip(){
  if(isRecording){stopRecording();}
  var rnd=state.current_round;
  for(var i=0;i<currentDraw.length;i++) state.articles[currentDraw[i].title].round=rnd;
  saveState();currentDraw=[];showPlaceholder();disableActions();refreshStat();
}
function resetRound(){
  if(!confirm('确定要重置第 '+state.current_round+' 轮吗？')) return;
  var rnd=state.current_round,a,st;
  for(var i=0;i<articles.length;i++){
    a=articles[i];st=state.articles[a.title];
    if(st&&st.round>=rnd){st.round=rnd-1;st.done=false;}
  }
  saveState();showPlaceholder();disableActions();refreshStat();
}
function undoMark(){
  if(currentDraw.length===0){toast('没有可撤销的操作');return;}
  var rnd=state.current_round;
  for(var i=0;i<currentDraw.length;i++){
    state.articles[currentDraw[i].title].round=rnd-1;
    state.articles[currentDraw[i].title].done=false;
  }
  saveState();currentDraw=[];showPlaceholder();disableActions();refreshStat();toast('已撤销');
}

// ==== 目录总表 ====
function openCatalog(){overlay.style.display='flex';renderCatalog();}
function closeCatalog(){overlay.style.display='none';addForm.style.display='none';}
function renderCatalog(){
  sheetBody.innerHTML='';catalogCount.textContent='共 '+articles.length+' 篇';
  var j,bk,sec,list,a,globalIdx,row;
  for(i=0;i<BOOKLET_ORDER.length;i++){
    bk=BOOKLET_ORDER[i];
    sec=document.createElement('div');sec.className='book-sec';
    sec.innerHTML='<div class="book-tt">'+bk+'</div>';
    list=[];
    for(j=0;j<articles.length;j++){if(articles[j].booklet===bk)list.push(articles[j]);}
    for(j=0;j<list.length;j++){
      a=list[j];globalIdx=articles.indexOf(a);
      row=document.createElement('div');row.className='arow';
      row.innerHTML='<span class="aseq">'+(a.seq||'?')+'</span><span class="aname">'+a.title+'</span><span class="ameta">'+(a.grade||'')+' '+(a.note||'')+'</span><button class="adel" data-idx="'+globalIdx+'">删</button>';
      (function(idx){
        row.onclick=function(e){
          if(e.target&&e.target.classList.contains('adel')) return;
          openDetail(idx);
        };
        row.querySelector('.adel').onclick=function(e){
          e.stopPropagation();
          var art=articles[idx];
          if(!confirm('确定删除\uff62'+art.title+'\uff63吗？')) return;
          if(state.articles[art.title]) delete state.articles[art.title];
          articles.splice(idx,1);
          saveArticles();syncState();
          renderCatalog();refreshStat();
        };
      })(globalIdx);
      sec.appendChild(row);
    }
    sheetBody.appendChild(sec);
  }
}

// ==== 文章详情弹窗 ====
function openDetail(idx){
  detailEditingIdx=idx;
  var a=articles[idx];
  detailTitle.textContent=a.title;
  detailBooklet.value=a.booklet;
  detailSeq.value=a.seq||'';
  detailGrade.value=a.grade||'';
  detailNote.value=a.note||'课外文言文';
  detailText.value=a.text||'';
  detailOverlay.style.display='flex';
}
function closeDetail(){detailOverlay.style.display='none';detailEditingIdx=-1;}
detailClose.onclick=closeDetail;
detailCancel.onclick=closeDetail;
detailOverlay.onclick=function(e){if(e.target===detailOverlay) closeDetail();};
detailSave.onclick=function(){
  if(detailEditingIdx<0) return;
  var a=articles[detailEditingIdx];
  var newBooklet=detailBooklet.value;
  var newTitle=detailTitle.textContent;
  var newSeq=parseInt(detailSeq.value)||0;
  var oldTitle=a.title;
  a.booklet=newBooklet;a.seq=newSeq;a.grade=detailGrade.value.trim();a.note=detailNote.value;a.text=detailText.value;
  if(newTitle!==oldTitle){
    a.title=newTitle;
    if(state.articles[oldTitle]){state.articles[newTitle]=state.articles[oldTitle];delete state.articles[oldTitle];}
  }
  saveArticles();syncState();
  closeDetail();
  renderCatalog();refreshStat();
  toast('\uff62'+a.title+'\uff63已保存');
};

// ==== 添加 ====
btnShowAdd.onclick=function(){addForm.style.display='block';};
btnConfirmAdd.onclick=function(){
  var booklet=$('addBooklet').value,title=$('addTitle').value.trim(),text=$('addText').value.trim(),grade=$('addGrade').value.trim(),note=$('addNote').value;
  if(!title){toast('请输入篇目名称');return;}
  var maxSeq=0,j;
  for(j=0;j<articles.length;j++){if(articles[j].booklet===booklet&&articles[j].seq>maxSeq)maxSeq=articles[j].seq;}
  articles.push({booklet:booklet,title:title,text:text,grade:grade,note:note,seq:maxSeq+1});
  saveArticles();syncState();
  renderCatalog();addForm.style.display='none';
  $('addTitle').value='';$('addText').value='';$('addGrade').value='';
  refreshStat();toast('已添加\uff62'+title+'\uff63');
};

// ==== 事件绑定 ====
btnDraw.onclick=draw;
btnDone.onclick=markDone;btnSkip.onclick=markSkip;
btnReveal.onclick=revealTitle;btnText.onclick=revealText;
btnReset.onclick=resetRound;btnUndo.onclick=undoMark;
btnMic.onclick=function(){if(isRecording)stopRecording();else startRecording();};
btnCatalog.onclick=openCatalog;
sheetClose.onclick=closeCatalog;
overlay.onclick=function(e){if(e.target===overlay)closeCatalog();};

function toast(msg){
  var el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);
  setTimeout(function(){if(el.parentNode) el.parentNode.removeChild(el);},2000);
}
refreshStat();
</script>
